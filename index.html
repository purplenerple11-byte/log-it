<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Log It</title>
  <style>
    :root {
      --bg:        #0a0a0a;
      --surface:   #141414;
      --surface2:  #1c1c1c;
      --border:    #2a2a2a;
      --text:      #f0f0f0;
      --text-dim:  #666;
      --red:       #e63946;
      --green:     #22c55e;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* ─── MAIN LAYOUT ─── */
    #app {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 32px 24px;
      gap: 32px;
    }

    /* ─── STATUS ─── */
    #status {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
      min-height: 20px;
      transition: color 0.2s;
      text-align: center;
    }
    #status.recording { color: var(--red); }

    /* ─── MIC BUTTON ─── */
    #mic-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pulse {
      position: absolute;
      border-radius: 50%;
      border: 1.5px solid var(--red);
      pointer-events: none;
      opacity: 0;
    }
    .pulse:nth-child(1) { width: 96px;  height: 96px;  }
    .pulse:nth-child(2) { width: 126px; height: 126px; }
    .pulse:nth-child(3) { width: 158px; height: 158px; }

    @keyframes ring-out {
      0%   { transform: scale(.85); opacity: .55; }
      100% { transform: scale(1.2); opacity: 0;   }
    }
    .recording .pulse:nth-child(1) { animation: ring-out 1.5s ease-out infinite; }
    .recording .pulse:nth-child(2) { animation: ring-out 1.5s ease-out .3s infinite; }
    .recording .pulse:nth-child(3) { animation: ring-out 1.5s ease-out .6s infinite; }

    #mic-btn {
      position: relative;
      z-index: 1;
      width: 84px; height: 84px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: var(--surface2);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      touch-action: none;
      transition: background .15s, border-color .15s;
      color: var(--text-dim);
    }
    #mic-btn.recording {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
    }
    #mic-btn svg { pointer-events: none; }

    /* ─── TRANSCRIPT ─── */
    #transcript {
      font-size: 15px;
      color: var(--text-dim);
      text-align: center;
      max-width: 300px;
      min-height: 22px;
      line-height: 1.6;
      font-style: italic;
    }

    /* ─── MODE TOGGLE ─── */
    #mode-toggle {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 3px;
    }
    .mode-btn {
      padding: 7px 20px;
      border-radius: 100px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background .15s, color .15s;
      white-space: nowrap;
    }
    .mode-btn.active {
      background: var(--surface2);
      color: var(--text);
    }

    /* ─── TEXT INPUT ─── */
    #text-wrap {
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #text-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      font-size: 16px;
      padding: 14px 16px;
      resize: none;
      min-height: 96px;
      font-family: inherit;
      line-height: 1.5;
      outline: none;
      -webkit-appearance: none;
      user-select: text;
      transition: border-color .15s;
    }
    #text-input:focus { border-color: #3a3a3a; }
    #text-input::placeholder { color: #3a3a3a; }
    #send-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background .15s;
    }
    #send-btn:active { background: #2a2a2a; }

    /* ─── HINT ─── */
    #hint {
      font-size: 12px;
      color: #333;
      letter-spacing: 0.04em;
      text-align: center;
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
    }

    /* ─── GEAR ─── */
    #gear-btn {
      position: fixed;
      top: 18px; right: 18px;
      background: none;
      border: none;
      color: #333;
      cursor: pointer;
      padding: 8px;
      border-radius: 8px;
      transition: color .15s;
    }
    #gear-btn:active { color: #666; }

    /* ─── CONFIRM CARD ─── */
    #confirm-card {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-radius: 20px 20px 0 0;
      padding: 22px 24px 40px;
      transform: translateY(110%);
      transition: transform .38s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 100;
      cursor: pointer;
    }
    #confirm-card.show { transform: translateY(0); }
    #card-icon { font-size: 28px; display: block; margin-bottom: 8px; }
    #card-msg  { font-size: 16px; font-weight: 500; color: var(--text); }
    #card-sub  { font-size: 13px; color: var(--text-dim); margin-top: 4px; }
    #card-bar  {
      height: 3px; border-radius: 2px;
      background: var(--border);
      margin-top: 16px; overflow: hidden;
    }
    #card-fill {
      height: 100%; width: 0%;
      border-radius: 2px;
    }

    /* ─── ERROR TOAST ─── */
    #err-toast {
      position: fixed;
      bottom: 24px; left: 16px; right: 16px;
      background: #1e0a0a;
      border: 1px solid #5a1a1a;
      border-radius: 12px;
      padding: 13px 16px;
      color: #e07070;
      font-size: 14px;
      display: none;
      z-index: 200;
    }

    /* ─── CONFIG OVERLAY ─── */
    #cfg-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.72);
      z-index: 300;
      display: none;
      backdrop-filter: blur(3px);
    }
    #cfg-panel {
      position: fixed;
      top: 0; right: -100%; bottom: 0;
      width: min(340px, 92vw);
      background: var(--surface);
      border-left: 1px solid var(--border);
      z-index: 301;
      overflow-y: auto;
      padding: 28px 20px 40px;
      transition: right .3s cubic-bezier(.4,0,.2,1);
    }
    #cfg-panel.open { right: 0; }

    .cfg-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px;
    }
    .cfg-head h2 { font-size: 17px; font-weight: 600; }
    #cfg-close {
      background: none; border: none;
      color: var(--text-dim); font-size: 20px;
      cursor: pointer; padding: 4px 8px;
    }
    .cfg-section {
      font-size: 10px; font-weight: 700;
      letter-spacing: .14em; text-transform: uppercase;
      color: #444; margin: 20px 0 10px;
    }
    .cfg-field { margin-bottom: 14px; }
    .cfg-label {
      display: block;
      font-size: 12px; font-weight: 500;
      color: var(--text-dim);
      margin-bottom: 6px;
    }
    .cfg-input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      font-family: 'Menlo', 'Consolas', monospace;
      padding: 10px 12px;
      outline: none;
      -webkit-appearance: none;
      user-select: text;
      transition: border-color .15s;
    }
    .cfg-input:focus { border-color: #3a3a3a; }
    #save-btn {
      width: 100%; margin-top: 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 14px;
      font-size: 15px; font-weight: 500;
      cursor: pointer;
      transition: background .15s;
    }
    #save-btn:active { background: #2a2a2a; }
    #save-ok {
      text-align: center; font-size: 13px;
      color: var(--green); margin-top: 8px;
      display: none;
    }

    /* ─── UTILITIES ─── */
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div id="app">
  <div id="status">Hold to log</div>

  <div id="mic-wrap">
    <div class="pulse"></div>
    <div class="pulse"></div>
    <div class="pulse"></div>
    <button id="mic-btn" aria-label="Hold to record voice entry">
      <!-- mic icon -->
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8"  y1="23" x2="16" y2="23"/>
      </svg>
    </button>
  </div>

  <div id="transcript"></div>

  <div id="mode-toggle">
    <button class="mode-btn active" id="btn-voice" onclick="setMode('voice')">🎤 Voice</button>
    <button class="mode-btn"        id="btn-text"  onclick="setMode('text')">⌨️ Type</button>
  </div>

  <div id="text-wrap" class="hidden">
    <textarea id="text-input"
      placeholder="Describe what you want to log…"
      rows="4"></textarea>
    <button id="send-btn" onclick="submitText()">Log It →</button>
  </div>
</div>

<div id="hint">speak naturally — it figures out the rest</div>

<button id="gear-btn" onclick="openConfig()" aria-label="Settings">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
       stroke="currentColor" stroke-width="1.8">
    <circle cx="12" cy="12" r="3"/>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06
             a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09
             A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83
             l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09
             A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83
             l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09
             a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83
             l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09
             a1.65 1.65 0 0 0-1.51 1z"/>
  </svg>
</button>

<!-- CONFIRMATION CARD -->
<div id="confirm-card" onclick="dismissConfirm()">
  <span id="card-icon">✓</span>
  <div id="card-msg">Logged</div>
  <div id="card-sub"></div>
  <div id="card-bar"><div id="card-fill"></div></div>
</div>

<!-- ERROR TOAST -->
<div id="err-toast">
  <strong>⚠ </strong><span id="err-msg">Something went wrong</span>
</div>

<!-- CONFIG PANEL -->
<div id="cfg-overlay" onclick="closeConfig()"></div>
<div id="cfg-panel">
  <div class="cfg-head">
    <h2>Settings</h2>
    <button id="cfg-close" onclick="closeConfig()">✕</button>
  </div>

  <div class="cfg-section">API Keys</div>
  <div class="cfg-field">
    <label class="cfg-label" for="cfg-gemini">Gemini API Key</label>
    <input type="password" class="cfg-input" id="cfg-gemini" placeholder="AIza…" autocomplete="off">
  </div>
  <div class="cfg-field">
    <label class="cfg-label" for="cfg-router">Apps Script URL</label>
    <input type="url" class="cfg-input" id="cfg-router" placeholder="https://script.google.com/macros/s/…/exec">
  </div>

  <div class="cfg-section">Sheet IDs</div>
  <div class="cfg-field">
    <label class="cfg-label" for="cfg-tip">Tips</label>
    <input type="text" class="cfg-input" id="cfg-tip" placeholder="Sheet ID">
  </div>
  <div class="cfg-field">
    <label class="cfg-label" for="cfg-meal">Meals</label>
    <input type="text" class="cfg-input" id="cfg-meal" placeholder="Sheet ID">
  </div>
  <div class="cfg-field">
    <label class="cfg-label" for="cfg-grocery">Grocery</label>
    <input type="text" class="cfg-input" id="cfg-grocery" placeholder="Sheet ID">
  </div>
  <div class="cfg-field">
    <label class="cfg-label" for="cfg-idea">Ideas</label>
    <input type="text" class="cfg-input" id="cfg-idea" placeholder="Sheet ID">
  </div>
  <div class="cfg-field">
    <label class="cfg-label" for="cfg-car">Car</label>
    <input type="text" class="cfg-input" id="cfg-car" placeholder="Sheet ID">
  </div>

  <button id="save-btn" onclick="saveConfig()">Save</button>
  <div id="save-ok">✓ Saved</div>
</div>

<script>
// ================================================================
// GEMINI MASTER PROMPT
// ================================================================
const SYSTEM_PROMPT = `You are a personal log entry parser. Extract structured data from the user's voice or text entry and return ONLY valid JSON — no markdown, no code fences, no explanation whatsoever.

CATEGORY CLASSIFICATION:
- "tip":     shift work, hours worked, tips made, track / valet work, susan's, clock in/out
- "meal":    eating, food items, meal types, supplements (creatine, fish oil, MCT, multivitamin)
- "grocery": need to buy/pick up, running out, grocery store items, out of something
- "idea":    idea, thought, concept, "what if", future plan, something to build or try
- "car":     oil change, repair, mileage, car maintenance, parts replaced, shop

TAB ROUTING FOR TIPS:
- Route to "Susans" if: mentions "susan" (any spelling/typo), OR resolved clock-in is 12:00pm or later
- Route to "Track"  if: mentions "track" or "valet", OR clock-in is before 12:00pm, OR no time/name given
- Ambiguous times without am/pm: 7 8 9 10 11 → AM   |   12 1 2 3 4 5 6 → PM
- Examples: "2-4" = 2:00pm–4:00pm (Susans). "8-4" = 8:00am–4:00pm (Track). "11-7" = 11:00am–7:00pm (Track).

BREAK DEDUCTION: Any shift over 5 hours → subtract 0.5 hrs from total hours BEFORE returning.

TOLERANCE: Fix obvious typos (wokred→worked, susand→susans, susans/susan/sue all count).

GROCERY CATEGORIES: Fruits & Veg | Proteins | Grains | Drinks | Household | Other

Return EXACTLY one of these JSON structures (pick the one matching the entry). No other text allowed.

--- TIP / TRACK ---
{"category":"tip","sub_route":"Track","data":{"hours":<number>,"tips":<number|null>,"hourly_rate":<tips÷hours 2dp|null>,"notes":"<string>"}}

--- TIP / SUSANS ---
{"category":"tip","sub_route":"Susans","data":{"clock_in":"<h:mma e.g. 2:00pm>","clock_out":"<h:mma>","hours":<number>,"notes":"<string>"}}

--- MEAL ---
{"category":"meal","sub_route":"Log","data":{"meal":"<Breakfast|Lunch|Dinner|Snack>","foods":"<comma-separated list>","calories":<estimated number>,"macros":"<XP / YC / ZF>","creatine":"<\u2713 or empty>","fish_oil":"<\u2713 or empty>","mct":"<\u2713 or empty>","multivitamin":"<\u2713 or empty>","notes":"<string>"}}

--- GROCERY ---
{"category":"grocery","sub_route":"Grocery List","data":{"items":[{"item":"<name>","category":"<Fruits & Veg|Proteins|Grains|Drinks|Household|Other>"}]}}

--- IDEA ---
{"category":"idea","sub_route":"Ideas","data":{"title":"<5-7 word title>","category":"<Business|Money|Creative|Personal|Random>","effort":"<Quick Win|Medium Project|Big Swing>","excitement":<1-5>,"next_step":"<one actionable first step>","tags":"<comma-separated keywords>"}}

--- CAR ---
{"category":"car","sub_route":"Maintenance Log","data":{"type":"<Oil Change|Repair>","mileage":<number|null>,"description":"<string>","parts_replaced":"<comma-separated or empty>","cost":<number|null>,"shop_diy":"<shop name or DIY>","notes":"<string>"}}

CRITICAL RULES:
- Never invent data not mentioned — use null or empty string "" for unknown fields.
- Always return ONLY the JSON object. No preamble. No explanation. No markdown.`;

// ================================================================
// CATEGORY DISPLAY CONFIG
// ================================================================
const CAT_UI = {
  'tip_Track':   { icon: '🏇', color: '#e8890c', label: 'Track'   },
  'tip_Susans':  { icon: '🌸', color: '#d946b8', label: "Susan's" },
  'meal':        { icon: '🍽️', color: '#22c55e', label: 'Meal'    },
  'grocery':     { icon: '🛒', color: '#3b82f6', label: 'Grocery' },
  'idea':        { icon: '💡', color: '#eab308', label: 'Idea'    },
  'car':         { icon: '🚗', color: '#9ca3af', label: 'Car'     },
};

function catKey(category, sub_route) {
  return category === 'tip' ? 'tip_' + sub_route : category;
}

// ================================================================
// STATE
// ================================================================
let isRecording  = false;
let currentText  = '';
let recognition  = null;
let mode         = 'voice';
let confirmTimer = null;

// ================================================================
// LOCAL STORAGE HELPERS (graceful degradation for private mode)
// ================================================================
const LS = {
  get: (k) => { try { return localStorage.getItem(k) || ''; } catch { return ''; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }
};

// ================================================================
// CONFIG
// ================================================================
function loadConfig() {
  document.getElementById('cfg-gemini').value  = LS.get('gemini_key');
  document.getElementById('cfg-router').value  = LS.get('router_url');
  document.getElementById('cfg-tip').value     = LS.get('sheet_tip');
  document.getElementById('cfg-meal').value    = LS.get('sheet_meal');
  document.getElementById('cfg-grocery').value = LS.get('sheet_grocery');
  document.getElementById('cfg-idea').value    = LS.get('sheet_idea');
  document.getElementById('cfg-car').value     = LS.get('sheet_car');
}

function saveConfig() {
  LS.set('gemini_key',    document.getElementById('cfg-gemini').value.trim());
  LS.set('router_url',    document.getElementById('cfg-router').value.trim());
  LS.set('sheet_tip',     document.getElementById('cfg-tip').value.trim());
  LS.set('sheet_meal',    document.getElementById('cfg-meal').value.trim());
  LS.set('sheet_grocery', document.getElementById('cfg-grocery').value.trim());
  LS.set('sheet_idea',    document.getElementById('cfg-idea').value.trim());
  LS.set('sheet_car',     document.getElementById('cfg-car').value.trim());

  const ok = document.getElementById('save-ok');
  ok.style.display = 'block';
  setTimeout(() => { ok.style.display = 'none'; }, 2000);
}

function openConfig() {
  loadConfig();
  document.getElementById('cfg-overlay').style.display = 'block';
  document.getElementById('cfg-panel').classList.add('open');
}

function closeConfig() {
  document.getElementById('cfg-overlay').style.display = 'none';
  document.getElementById('cfg-panel').classList.remove('open');
}

// ================================================================
// MODE TOGGLE
// ================================================================
function setMode(m) {
  mode = m;
  document.getElementById('btn-voice').classList.toggle('active', m === 'voice');
  document.getElementById('btn-text').classList.toggle('active', m === 'text');
  document.getElementById('mic-wrap').classList.toggle('hidden', m === 'text');
  document.getElementById('hint').classList.toggle('hidden', m === 'text');
  document.getElementById('text-wrap').classList.toggle('hidden', m === 'voice');
  document.getElementById('transcript').textContent = '';
  setStatus(m === 'voice' ? 'Hold to log' : 'Type your entry');
}

// ================================================================
// WEB SPEECH API
// ================================================================
function initSpeech() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    // No speech support — switch to text mode and hide voice button
    document.getElementById('btn-voice').style.display = 'none';
    setMode('text');
    return;
  }

  recognition = new SR();
  recognition.lang = 'en-US';
  recognition.interimResults = true;
  recognition.continuous = false;
  recognition.maxAlternatives = 1;

  recognition.onresult = (e) => {
    let interim = '', final = '';
    for (const r of e.results) {
      if (r.isFinal) final += r[0].transcript;
      else           interim += r[0].transcript;
    }
    currentText = final || interim;
    document.getElementById('transcript').textContent = currentText;
  };

  recognition.onerror = (e) => {
    if (e.error !== 'aborted' && e.error !== 'no-speech') {
      showError('Mic error: ' + e.error);
    }
    stopRecordingUI();
  };

  recognition.onend = () => {
    stopRecordingUI();
    const text = currentText.trim();
    currentText = '';
    if (text) processEntry(text);
  };
}

function startRecording() {
  if (isRecording || !recognition) return;
  if (!validateConfig()) return;

  currentText = '';
  document.getElementById('transcript').textContent = '';
  isRecording = true;

  document.getElementById('mic-btn').classList.add('recording');
  document.getElementById('mic-wrap').classList.add('recording');
  setStatus('Listening…', 'recording');

  try { recognition.start(); } catch { stopRecordingUI(); }
}

function stopRecording() {
  if (!isRecording) return;
  try { recognition.stop(); } catch {}
}

function stopRecordingUI() {
  isRecording = false;
  document.getElementById('mic-btn').classList.remove('recording');
  document.getElementById('mic-wrap').classList.remove('recording');
  setStatus('Hold to log');
}

// Mic button — touch & mouse
const micBtn = document.getElementById('mic-btn');
micBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(); }, { passive: false });
micBtn.addEventListener('touchend',   (e) => { e.preventDefault(); stopRecording();  }, { passive: false });
micBtn.addEventListener('touchcancel',(e) => { e.preventDefault(); stopRecording();  }, { passive: false });
micBtn.addEventListener('mousedown',  startRecording);
document.addEventListener('mouseup',  () => { if (isRecording) stopRecording(); });

// ================================================================
// TEXT MODE
// ================================================================
function submitText() {
  const input = document.getElementById('text-input');
  const text  = input.value.trim();
  if (!text) return;
  if (!validateConfig()) return;
  processEntry(text);
  input.value = '';
}

document.getElementById('text-input').addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') submitText();
});

// ================================================================
// VALIDATION
// ================================================================
function validateConfig() {
  if (!LS.get('gemini_key')) { showError('Open ⚙ Settings and add your Gemini API key'); openConfig(); return false; }
  if (!LS.get('router_url')) { showError('Open ⚙ Settings and add your Apps Script URL'); openConfig(); return false; }
  return true;
}

function sheetIdFor(category) {
  const map = { tip: 'sheet_tip', meal: 'sheet_meal', grocery: 'sheet_grocery', idea: 'sheet_idea', car: 'sheet_car' };
  return LS.get(map[category] || '');
}

// ================================================================
// CORE FLOW
// ================================================================
async function processEntry(text) {
  setStatus('Thinking…');
  document.getElementById('transcript').textContent = text;

  try {
    // Step 1 — Gemini classification + extraction
    const parsed = await callGemini(text);

    // Step 2 — Send to Apps Script router
    setStatus('Saving…');
    const sheetId = sheetIdFor(parsed.category);
    if (!sheetId) {
      throw new Error('No Sheet ID set for "' + parsed.category + '" — check ⚙ Settings');
    }
    const result = await callRouter({ ...parsed, sheet_id: sheetId });

    // Step 3 — Confirm
    showConfirm(parsed.category, parsed.sub_route, result.message);
    setStatus('Logged ✓');
    setTimeout(() => {
      setStatus(mode === 'voice' ? 'Hold to log' : 'Type your entry');
      document.getElementById('transcript').textContent = '';
    }, 3800);

  } catch (err) {
    showError(err.message || 'Something went wrong');
    setStatus(mode === 'voice' ? 'Hold to log' : 'Type your entry');
    document.getElementById('transcript').textContent = '';
  }
}

// ================================================================
// GEMINI API
// ================================================================
async function callGemini(text) {
  const key = LS.get('gemini_key');
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`;

  const body = {
    systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
    contents: [{ role: 'user', parts: [{ text }] }],
    generationConfig: {
      temperature: 0,
      responseMimeType: 'application/json',
      maxOutputTokens: 512
    }
  };

  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });

  if (!res.ok) {
    let msg = `Gemini error ${res.status}`;
    try {
      const e = await res.json();
      if (e.error?.message) msg = e.error.message;
    } catch {}
    throw new Error(msg);
  }

  const data = await res.json();
  const raw  = data.candidates?.[0]?.content?.parts?.[0]?.text;
  if (!raw) throw new Error('Empty response from Gemini');

  // Strip any accidental markdown fences
  const clean = raw.replace(/```json|```/gi, '').trim();
  return JSON.parse(clean);
}

// ================================================================
// APPS SCRIPT ROUTER
// ================================================================
async function callRouter(payload) {
  const url = LS.get('router_url');

  // Use text/plain to avoid pre-flight CORS on Apps Script
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload),
    redirect: 'follow'
  });

  if (!res.ok) throw new Error(`Router error ${res.status}`);

  const data = await res.json();
  if (!data.success) throw new Error(data.error || 'Router returned failure');

  return data;
}

// ================================================================
// UI HELPERS
// ================================================================
function setStatus(text, cls) {
  const el = document.getElementById('status');
  el.textContent = text;
  el.className = cls || '';
}

function showConfirm(category, sub_route, message) {
  const key = catKey(category, sub_route);
  const cfg = CAT_UI[key] || { icon: '✓', color: '#888', label: category };

  document.getElementById('card-icon').textContent = cfg.icon;
  document.getElementById('card-msg').textContent  = message;
  document.getElementById('card-sub').textContent  = cfg.label;

  const fill = document.getElementById('card-fill');
  fill.style.background  = cfg.color;
  fill.style.transition  = 'none';
  fill.style.width       = '0%';

  const card = document.getElementById('confirm-card');
  card.classList.add('show');

  requestAnimationFrame(() => requestAnimationFrame(() => {
    fill.style.transition = 'width 3.8s linear';
    fill.style.width = '100%';
  }));

  if (confirmTimer) clearTimeout(confirmTimer);
  confirmTimer = setTimeout(dismissConfirm, 3900);
}

function dismissConfirm() {
  document.getElementById('confirm-card').classList.remove('show');
  if (confirmTimer) { clearTimeout(confirmTimer); confirmTimer = null; }
}

function showError(msg) {
  document.getElementById('err-msg').textContent = msg;
  const toast = document.getElementById('err-toast');
  toast.style.display = 'block';
  setTimeout(() => { toast.style.display = 'none'; }, 5000);
}

// ================================================================
// INIT
// ================================================================
initSpeech();
loadConfig();

// Auto-open settings on first launch if no key saved
if (!LS.get('gemini_key')) {
  setTimeout(openConfig, 600);
}

// Suppress long-press context menu on the mic button
window.addEventListener('contextmenu', (e) => {
  if (e.target.closest('#mic-btn')) e.preventDefault();
});
</script>
