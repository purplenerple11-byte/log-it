<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#121316">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="theme.css">
  <title>Shifts — Log It</title>
</head>
<body>

<div class="top">
  <a class="back" href="index.html" aria-label="Back to Log It">&#8249;</a>
  <h1>Shifts</h1>
  <span class="stamp" id="stamp"></span>
</div>

<div id="gate" class="gate" hidden>
  <p>This one needs your read key. It lives in Apps Script under
     <code>READ_TOKEN</code>, and is stored on this device only.</p>
  <input id="key" type="password" autocomplete="off" placeholder="Read key">
  <button id="key-save">Unlock</button>
</div>

<div id="main" hidden>
  <div class="cards">
    <div class="card">
      <div class="k" id="sum-k">Take-home</div>
      <div class="v" id="sum-v">—</div>
      <div class="s" id="sum-s"></div>
    </div>
    <div class="card">
      <div class="k">Effective rate</div>
      <div class="v" id="eff-v">—</div>
      <div class="s" id="eff-s"></div>
    </div>
  </div>

  <div class="seg" role="group" aria-label="Time range">
    <button id="seg-week" aria-pressed="true">Weekly</button>
    <button id="seg-month" aria-pressed="false">Monthly</button>
  </div>

  <div class="legend" id="legend"></div>
  <div class="chart" id="chart"></div>
  <div class="xlab" id="xlab"></div>
  <div class="zoomhint" id="zoomhint"></div>

  <div class="chips" role="group" aria-label="Venue">
    <button class="chip" data-venue="all" aria-pressed="true">All</button>
    <button class="chip" data-venue="Track" aria-pressed="false">Track</button>
    <button class="chip" data-venue="Susans" aria-pressed="false">Susans</button>
  </div>
  <div id="log"></div>
</div>

<div id="boot" class="msg">
  <div class="skeleton" style="width:60%;margin:0 auto 14px"></div>
  <div class="skeleton" style="width:85%;margin:0 auto 14px"></div>
  <div class="skeleton" style="width:70%;margin:0 auto"></div>
</div>

<script src="shiftStats.js"></script>
<script src="dataClient.js"></script>
<script src="ui.js"></script>
<script>
const MOCK = new URLSearchParams(location.search).get('mock') === '1';

let SHIFTS = [];
let grain = 'week';
let venue = 'all';
let openRow = null;
let zoomWeek = null;   // bucket key of the drilled-into week, or null
let legendBase = '';   // stashed so unzooming restores it without a full render

const $ = (id) => document.getElementById(id);

// ---------------------------------------------------------------
// RENDER
// ---------------------------------------------------------------
function renderAll() {
  const byVenue = filterShifts(SHIFTS, { venue });
  // The chart always draws every week — that is what you click to drill in.
  // The summary and the log follow the drill-down, so the big number on screen
  // always describes exactly the rows listed underneath it.
  const shown = filterShifts(byVenue, { week: zoomWeek });
  renderSummary(shown);
  renderChart(byVenue);
  renderLog(shown);
}

function renderSummary(shown) {
  const s = summarize(shown);
  // Track and Susans are reported separately on purpose: Track's figure is net
  // of withholding, Susans' $20/hr is gross. Adding them would be meaningless.
  if (venue === 'Susans') {
    $('sum-k').textContent = 'Gross pay';
    $('sum-v').textContent = money0(s.susansGross);
    $('sum-s').textContent = s.susansHours + 'h · before tax';
    $('eff-v').textContent = '$20.00';
    $('eff-s').textContent = 'flat, no withholding modeled';
    return;
  }
  $('sum-k').textContent = 'Take-home';
  $('sum-v').textContent = money0(s.trackTakeHome);
  $('sum-s').textContent = money0(s.trackTips) + ' tips + ' + money0(s.trackNetWage) + ' wage';
  $('eff-v').textContent = money(s.trackEffHourly);
  $('eff-s').textContent = s.trackHours + 'h over ' + s.trackShifts + ' Track shifts'
    + (s.susansGross ? ' · Susans ' + money0(s.susansGross) + ' gross, separate' : '');
}

function renderChart(shown) {
  // The chart plots ONE venue's money at a time. Stacking Susans' gross $20/hr
  // on top of Track's post-withholding net produces a bar that is part
  // post-tax and part pre-tax, under a legend that would call all of it wage.
  // Susans is reported in the summary line and the log instead.
  const susansOnly = venue === 'Susans';
  const value = (b) => (susansOnly ? b.susansGross : b.takeHome);
  // Trim AFTER slicing, not before: trimming first finds the earliest non-empty
  // week in all of history and removes nothing, then the slice re-introduces
  // leading zeros at the visible edge.
  const buckets = trimLeadingEmpty(
    bucketShifts(shown, grain).slice(grain === 'week' ? -10 : -8), value);
  const max = Math.max(1, ...buckets.map(value));
  const thisKey = grain === 'week' ? currentWeekKey() : currentMonthKey();

  legendBase = susansOnly
    ? '<span><span class="swatch" style="background:var(--wage)"></span>Gross pay, before tax</span>'
    : '<span><span class="swatch" style="background:var(--action)"></span>Tips</span>'
      + '<span><span class="swatch" style="background:var(--wage)"></span>Net wage</span>'
      + '<span style="margin-left:auto">Track take-home</span>';
  $('legend').innerHTML = legendBase;

  $('chart').innerHTML = buckets.map((b) => {
    const tipH = susansOnly ? 0 : Math.round((b.tips / max) * 110);
    const wageH = Math.round(((value(b) - (susansOnly ? 0 : b.tips)) / max) * 110);
    // The number sits on the bar, not in a title attribute: a tooltip is
    // nothing on a touchscreen, which is where this is actually read.
    // The current bucket is still being earned; at full strength it reads as
    // a slump every time you look at it mid-week.
    return '<div class="col' + (b.key === thisKey ? ' partial' : '') + '"'
      + ' data-key="' + escapeHtml(b.key) + '" role="button" tabindex="0"'
      + ' aria-label="' + escapeHtml(b.label + ', ' + money(value(b))) + '">'
      + '<div class="val">' + compactMoney(value(b)) + '</div>'
      + '<div class="tip" style="height:' + tipH + 'px"></div>'
      + '<div class="wage" style="height:' + wageH + 'px"></div></div>';
  }).join('') || '<div class="msg">No shifts yet</div>';

  $('xlab').innerHTML = buckets.map((b) => '<div>' + escapeHtml(b.label) + '</div>').join('');

  document.querySelectorAll('.chart .col').forEach((c) => {
    // Stash the week/tips view so unzooming can put it back verbatim rather
    // than re-rendering the whole chart, which would kill the transition.
    c._base = c.innerHTML;
    // Monthly bars key on a month, not a pay week, so drilling in would filter
    // the log by a key no shift carries and empty the page. Weekly only.
    if (grain !== 'week') { c.style.cursor = 'default'; c.removeAttribute('role'); return; }
    const go = () => toggleZoom(c.dataset.key);
    c.onclick = go;
    c.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } };
  });
  applyZoom(shown);
}

// Drilling in and out mutates the existing columns instead of re-rendering.
// Replacing innerHTML would swap in brand-new nodes, which paint at their final
// state with no transition at all — the same reason index.html needs a keyframe
// for the Today fan.
function applyZoom(shown) {
  const chart = $('chart');
  const cols = Array.from(chart.querySelectorAll('.col'));
  const idx = zoomWeek ? cols.findIndex((c) => c.dataset.key === zoomWeek) : -1;

  if (idx === -1) {
    chart.classList.remove('zoomed');
    cols.forEach((c) => {
      c.classList.remove('out-left', 'out-right', 'zoom');
      if (c._base && c.innerHTML !== c._base) c.innerHTML = c._base;
    });
    $('zoomhint').innerHTML = '';
    $('xlab').style.display = '';
    if (legendBase) $('legend').innerHTML = legendBase;
    return;
  }

  chart.classList.add('zoomed');
  cols.forEach((c, i) => {
    c.classList.toggle('out-left', i < idx);
    c.classList.toggle('out-right', i > idx);
    c.classList.toggle('zoom', i === idx);
  });
  fillDays(cols[idx], shown);

  // The week axis would otherwise still list every week underneath a chart
  // that now shows exactly one, and the tips/wage legend no longer describes
  // what the blocks are.
  $('xlab').style.display = 'none';
  $('legend').innerHTML = (venue === 'Susans'
    ? '<span><span class="swatch" style="background:var(--wage)"></span>Gross pay, before tax</span>'
    : '<span><span class="swatch" style="background:var(--action)"></span>Tips</span>'
      + '<span><span class="swatch" style="background:var(--wage)"></span>Net wage</span>')
    + '<span style="margin-left:auto">each block is a day</span>';

  const label = cols[idx].getAttribute('aria-label') || '';
  $('zoomhint').innerHTML = 'Week of <b>' + escapeHtml(label.split(',')[0])
    + '</b> · tap the bar to go back';
}

// The bar becomes one block per day worked, each sized by what that day made.
// Heights stay strictly proportional — a day is not padded up to fit its label;
// the label is dropped instead, because a block that lies about its size is
// worse than one you have to read from the row below.
function fillDays(col, shown) {
  const susansOnly = venue === 'Susans';
  const days = bucketShifts(filterShifts(shown, { week: zoomWeek }), 'day');
  const dayValue = (b) => (susansOnly ? b.susansGross : b.takeHome);
  const total = days.reduce((n, b) => n + dayValue(b), 0) || 1;
  const H = 224;

  // Reversed: flex-end stacks the first child at the top, and the week should
  // read Monday at the bottom upward.
  col.innerHTML = days.slice().reverse().map((b, n) => {
    const dv = dayValue(b);
    const h = Math.max(4, Math.round((dv / total) * H));
    // Each day keeps the same tips-on-wage split as the week bars it came
    // from. A solid block would have thrown that away — which is the whole
    // reason for two colours in the first place.
    const tipsH = susansOnly ? 0 : Math.round((b.tips / (dv || 1)) * h);
    const room = h >= 17;
    return '<div class="day' + (h < 26 ? ' thin' : '') + '" style="height:' + h
      + 'px;--i:' + n + '">'
      + '<div class="dtip" style="height:' + tipsH + 'px"></div>'
      + '<div class="dwage" style="height:' + (h - tipsH) + 'px"></div>'
      + (room ? '<div class="dlab"><span>' + escapeHtml(b.label) + '</span>'
                + '<span>' + (susansOnly ? '<span class="lt">' + compactMoney(dv) + '</span>'
                    : '<span class="lt">' + compactMoney(b.tips) + '</span>'
                      + '<span class="lw">+ ' + compactMoney(b.netWage) + '</span>')
                + '</span></div>' : '')
      + '</div>';
  }).join('');
}

function toggleZoom(key) {
  zoomWeek = zoomWeek === key ? null : key;
  openRow = null;
  const byVenue = filterShifts(SHIFTS, { venue });
  const shown = filterShifts(byVenue, { week: zoomWeek });
  renderSummary(shown);
  renderLog(shown);
  applyZoom(byVenue);
}

function renderLog(shown) {
  if (!shown.length) { $('log').innerHTML = '<div class="msg">No shifts here</div>'; return; }

  $('log').innerHTML = shown.map((s, i) => {
    const isOpen = openRow === i;
    const amt = s.venue === 'Susans' ? s.grossPay : (s.pay ? s.pay.takeHome : null);
    const rate = s.venue === 'Susans' ? 20 : (s.pay ? s.pay.effHourly : null);
    const est = s.pay && s.pay.source === 'computed';

    let meta = s.venue + ' · ' + s.hours + 'h';
    if (s.tips) meta += ' · ' + money0(s.tips) + ' tips';
    if (s.dupeOf) meta += ' · <span class="flag">possible duplicate</span>';

    return '<button class="row" data-i="' + i + '">'
      + '<span><span class="d">' + dayLabel(s.ts) + '</span>'
      + '<span class="m">' + meta + '</span></span>'
      + '<span class="amt"><span class="a' + (est ? ' est' : '') + '">'
      + (amt === null ? '—' : money(amt)) + '</span>'
      + '<span class="r">' + (rate === null ? 'no pay data' : money(rate) + '/hr')
      + (est ? ' est.' : '') + '</span></span></button>'
      + (isOpen ? detailHtml(s, i) : '');
  }).join('');

  document.querySelectorAll('.row').forEach((el) => {
    el.onclick = () => {
      const i = Number(el.dataset.i);
      openRow = openRow === i ? null : i;
      renderLog(shown);
    };
  });
  document.querySelectorAll('.del').forEach((el) => {
    el.onclick = (e) => { e.stopPropagation(); removeShift(shown[Number(el.dataset.i)]); };
  });
}

function detailHtml(s, i) {
  let h = '<div class="detail">';
  if (s.notes) h += '<div class="note">' + escapeHtml(s.notes) + '</div>';
  h += 'Logged ' + timeLabel(s.ts);
  if (s.clockIn) h += ' · ' + escapeHtml(s.clockIn) + ' to ' + escapeHtml(s.clockOut || '?');
  if (s.pay) {
    h += '<br>' + money(s.pay.gross) + ' gross · ' + money(s.pay.net) + ' net wage · '
       + money(s.tips) + ' tips';
    if (s.pay.source === 'computed') {
      h += '<br><span class="est">Estimated — this row predates the pay columns, '
         + 'so these are recomputed, not stored.</span>';
    }
  }
  if (s.dupeOf) {
    h += '<div style="margin-top:12px"><button class="danger del" data-i="' + i + '">'
       + 'Delete this duplicate</button></div>';
  }
  return h + '</div>';
}

function currentWeekKey() {
  const d = new Date();
  const back = d.getDay() === 0 ? 6 : d.getDay() - 1;
  const m = new Date(d.getFullYear(), d.getMonth(), d.getDate() - back);
  return m.getFullYear() + '-' + String(m.getMonth() + 1).padStart(2, '0')
       + '-' + String(m.getDate()).padStart(2, '0');
}
function currentMonthKey() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

// ---------------------------------------------------------------
// DELETE
// ---------------------------------------------------------------
async function removeShift(s) {
  const label = dayLabel(s.ts) + ' · ' + s.venue + ' · ' + s.hours + 'h'
    + (s.tips ? ' · ' + money0(s.tips) + ' tips' : '');
  // Deleting also rewrites the rest of that Track pay week, so the confirm
  // says so rather than pretending one row is all that changes.
  const warn = s.venue === 'Track'
    ? label + '. The other shifts in that pay week will have their take-home recomputed.'
    : label + '. This cannot be undone from here.';
  if (!await uiConfirm('Delete this shift?', warn, { okLabel: 'Delete', danger: true })) return;

  if (MOCK) {
    SHIFTS = SHIFTS.filter((x) => x !== s);
    markDuplicates(SHIFTS);
    openRow = null;
    setStamp('deleted (mock — nothing was written)');
    renderAll();
    return;
  }

  try {
    setStamp('deleting…', true);
    const res = await deleteShift({
      target: 'shift', venue: s.venue, ts: s.ts.toISOString(),
      expect: { hours: s.hours, tips: s.tips },
      sheet_ids: { tip: sheetId('tip') }
    });
    setStamp(res.recomputed.length
      ? 'deleted · ' + res.recomputed.length + ' row(s) in that week recomputed'
      : 'deleted');
    load();
  } catch (err) {
    await uiAlert("Didn't delete", err.message);
    setStamp('');
  }
}

// ---------------------------------------------------------------
// LOAD
// ---------------------------------------------------------------
function setStamp(text, busy) {
  $('stamp').textContent = text;
  $('stamp').className = 'stamp' + (busy ? ' busy' : '');
}

function show(which) {
  $('boot').hidden = which !== 'boot';
  $('gate').hidden = which !== 'gate';
  $('main').hidden = which !== 'main';
}

function accept(data, fresh) {
  SHIFTS = hydrateShifts(data.shifts);
  show('main');
  setStamp(fresh ? '' : 'as of ' + timeLabel(new Date(data.fetched_at)), !fresh);
  renderAll();
}

function load() {
  if (MOCK) { accept(mockShiftsResponse(), true); return; }

  loadScope('shifts', { tip: sheetId('tip') }, accept, (err, hadCache) => {
    if (err.kind === 'unauthorized' && !hadCache) { show('gate'); return; }
    setStamp(hadCache ? 'offline — showing last known' : err.message);
    if (!hadCache) { show('main'); $('log').innerHTML = '<div class="msg">' + escapeHtml(err.message) + '</div>'; }
  });
}

// ---------------------------------------------------------------
// WIRING
// ---------------------------------------------------------------
$('seg-week').onclick = () => { grain = 'week'; syncSeg(); renderAll(); };
$('seg-month').onclick = () => { grain = 'month'; zoomWeek = null; syncSeg(); renderAll(); };
function syncSeg() {
  $('seg-week').setAttribute('aria-pressed', String(grain === 'week'));
  $('seg-month').setAttribute('aria-pressed', String(grain === 'month'));
}

document.querySelectorAll('.chip').forEach((c) => {
  c.onclick = () => {
    venue = c.dataset.venue;
    openRow = null;
    // Changing venue is a context switch, so the drill-down is dropped. Keeping
    // it strands you when the new venue has no shifts that week: the bar is
    // gone from the chart, so there is nothing left to tap to get back, but the
    // log is still filtered to it and reads as empty for no visible reason.
    zoomWeek = null;
    document.querySelectorAll('.chip').forEach((x) =>
      x.setAttribute('aria-pressed', String(x.dataset.venue === venue)));
    renderAll();
  };
});

$('key-save').onclick = () => {
  const v = $('key').value.trim();
  if (!v) return;
  setReadToken(v);
  show('boot');
  load();
};

if (MOCK) {
  // The fixture runs on the real server modules, so ?mock=1 proves the read
  // pipeline end to end without a deploy. Dev only — production never loads
  // server logic.
  let left = 3;
  for (const src of ['server/trackPay.js', 'server/readApi.js', 'mockSheet.js']) {
    const el = document.createElement('script');
    el.src = src + '?cb=' + Date.now();
    el.async = false;
    el.onload = () => { if (--left === 0) load(); };
    document.head.appendChild(el);
  }
} else {
  load();
}
</script>
</body>
</html>
